[workspace]
resolver = "2"
members = ["crates/noscat-core", "crates/noscat"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["noscat contributors"]

[workspace.dependencies]
noscat-core = { path = "crates/noscat-core" }
nostr = { version = "0.45", features = ["nip44", "nip59"] }
nostr-sdk = { version = "0.45" }
snow = "0.10"
curve25519-dalek = "4.1"
secp256k1 = { version = "0.30", default-features = false, features = ["alloc", "std", "rand"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.9"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "io-std",
    "sync",
    "signal",
] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
strip = true
