[workspace]
resolver = "2"
members = ["crates/noscat-core", "crates/noscat", "crates/noscat-client"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"
authors = ["noscat contributors"]
repository = "https://github.com/Letdown2491/noscat"

[workspace.dependencies]
# The version on this workspace dependency must stay in lockstep with the
# workspace version: crates.io rejects path-only dependencies, so the
# published `noscat` crate pins `noscat-core` by this version.
noscat-core = { path = "crates/noscat-core", version = "0.1.3" }
noscat-client = { path = "crates/noscat-client", version = "0.1.3" }
nostr = { version = "0.45", features = ["nip44", "nip59"] }
nostr-sdk = { version = "0.45" }
snow = "0.10"
curve25519-dalek = "4.1"
secp256k1 = { version = "0.30", default-features = false, features = ["alloc", "std", "rand"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.9"
openmls = "0.8.1"
openmls_basic_credential = "0.5"
openmls_rust_crypto = { version = "0.5.1", features = ["test-utils"] }
openmls_traits = "0.5"
openmls_sqlite_storage = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
tls_codec = "0.4"
ed25519-dalek = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "io-std",
    "fs",
    "sync",
    "signal",
] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
strip = true
