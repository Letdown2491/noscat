[workspace]
resolver = "2"
members = ["crates/noscat-core", "crates/noscat", "crates/noscat-client", "crates/noscat-ffi"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
authors = ["noscat contributors"]
repository = "https://github.com/Letdown2491/noscat"

[workspace.dependencies]
# The version on this workspace dependency must stay in lockstep with the
# workspace version: crates.io rejects path-only dependencies, so the
# published `noscat` crate pins `noscat-core` by this version.
noscat-core = { path = "crates/noscat-core", version = "0.5.0" }
noscat-client = { path = "crates/noscat-client", version = "0.5.0" }
nostr = { version = "0.45", features = ["nip44", "nip59"] }
nostr-sdk = { version = "0.45" }
secp256k1 = { version = "0.30", default-features = false, features = ["alloc", "std", "rand"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.9"
qrcode = { version = "0.14", default-features = false }
# Marmot needs the AppDataDictionary extension and AppDataUpdate proposal
# (draft-ietf-mls-extensions), first published in 0.10.0-rc.1. Pinned
# exactly while it is a release candidate.
openmls = { version = "=0.10.0-rc.1", features = ["extensions-draft"] }
openmls_basic_credential = { version = "=0.7.0-rc.1", features = ["clonable"] }
openmls_rust_crypto = "=0.7.0-rc.1"
openmls_traits = { version = "=0.7.0-rc.1", features = ["extensions-draft"] }
openmls_memory_storage = { version = "=0.7.0-rc.1", features = ["extensions-draft"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
tls_codec = "0.5"
ed25519-dalek = "2"
# 0.5 data plane (ADR 0002, 0003). Pinned exactly: the fork moves fast.
nvpn-fips-core = "=0.4.124"
# FIPS speaks nostr 0.44 events; adverts cross the seam as JSON.
fips-nostr = { package = "nostr", version = "0.44", default-features = false, features = ["std"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "io-std",
    "fs",
    "sync",
] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
strip = true
