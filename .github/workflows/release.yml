# Release: tag v* builds every package and attaches it to the GitHub
# release. One leg per architecture, each on a native runner (no cross
# toolchains - musl.cc is unreachable from runners, and native musl-gcc
# comes from the distro's musl-tools package).
#
# - Linux (x86_64 + aarch64): static musl binaries -> deb/rpm/apk/archlinux
#   via nfpm (one config, packaging/nfpm.yaml), plus tarballs for the
#   curl|sh install script.
# - macOS (aarch64 + x86_64): unsigned tarballs; the publish job generates
#   the Homebrew formula (noscat.rb) with real sha256s for the tap.
# - Windows (x86_64): zip for the winget manifest (packaging/winget/).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: linux ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            nfpm_arch: amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            nfpm_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-gcc (native; bundled sqlite needs a C compiler)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build (static musl)
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage and smoke-check
        run: |
          mkdir -p staging/completions dist
          cp target/${{ matrix.target }}/release/noscat staging/noscat
          cp packaging/noscat.1 staging/
          ./staging/noscat --version
          ./staging/noscat completions bash  > staging/completions/noscat.bash
          ./staging/noscat completions zsh   > staging/completions/noscat.zsh
          ./staging/noscat completions fish  > staging/completions/noscat.fish
          tar -czf dist/noscat-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz \
              -C staging noscat noscat.1 completions

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Package (deb, rpm, apk, archlinux)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ARCH: ${{ matrix.nfpm_arch }}
        run: |
          for fmt in deb rpm apk archlinux; do
            nfpm package -f packaging/nfpm.yaml -p "$fmt" -t dist/
          done
          # Smoke: each package reads back and names the payload.
          ls -la dist/
          dpkg-deb --info dist/noscat_${VERSION}_${{ matrix.nfpm_arch }}.deb | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  macos:
    name: macos ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest # arm64 (macos-26)
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage and smoke-check
        run: |
          mkdir -p staging/completions dist
          cp target/${{ matrix.target }}/release/noscat staging/noscat
          cp packaging/noscat.1 staging/
          ./staging/noscat --version
          ./staging/noscat completions bash > staging/completions/noscat.bash
          ./staging/noscat completions zsh  > staging/completions/noscat.zsh
          ./staging/noscat completions fish > staging/completions/noscat.fish
          tar -czf dist/noscat-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz \
              -C staging noscat noscat.1 completions

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  windows:
    name: windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Zip and smoke-check
        shell: pwsh
        run: |
          mkdir dist
          & target/release/noscat.exe --version
          Compress-Archive -Path target/release/noscat.exe `
            -DestinationPath dist/noscat-$env:GITHUB_REF_NAME-windows-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          retention-days: 1

  release:
    name: publish release
    needs: [linux, macos, windows]
    # needs holds the publish for the whole build matrix: a failed arch
    # publishes nothing, which is the right shape for a release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate the Homebrew formula with real sha256s
        run: |
          SHA_ARM=$(sha256sum dist/noscat-$GITHUB_REF_NAME-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)
          SHA_X86=$(sha256sum dist/noscat-$GITHUB_REF_NAME-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)
          SHA_LIN_ARM=$(sha256sum dist/noscat-$GITHUB_REF_NAME-aarch64-unknown-linux-musl.tar.gz | cut -d' ' -f1)
          SHA_LIN_X86=$(sha256sum dist/noscat-$GITHUB_REF_NAME-x86_64-unknown-linux-musl.tar.gz | cut -d' ' -f1)
          # Craft Linux bottles from the musl tarballs (static binary, no paths
          # to relocate) so brew pour works without a C toolchain.
          chmod +x packaging/make-bottle.sh
          packaging/make-bottle.sh "${{ steps.ver.outputs.version }}" \
            packaging/noscat.rb dist/noscat-$GITHUB_REF_NAME-x86_64-unknown-linux-musl.tar.gz \
            x86_64_linux dist/ > /tmp/x86.sha
          packaging/make-bottle.sh "${{ steps.ver.outputs.version }}" \
            packaging/noscat.rb dist/noscat-$GITHUB_REF_NAME-aarch64-unknown-linux-musl.tar.gz \
            arm64_linux dist/ > /tmp/arm.sha
          sed -e "s/__VERSION__/${{ steps.ver.outputs.version }}/" \
              -e "s/__SHA256_AARCH64__/$SHA_ARM/" \
              -e "s/__SHA256_X86_64__/$SHA_X86/" \
              -e "s/__SHA256_LINUX_AARCH64__/$SHA_LIN_ARM/" \
              -e "s/__SHA256_LINUX_X86_64__/$SHA_LIN_X86/" \
              -e "s/__SHA256_BOTTLE_X86_64_LINUX__/$(cut -d' ' -f1 /tmp/x86.sha)/" \
              -e "s/__SHA256_BOTTLE_ARM64_LINUX__/$(cut -d' ' -f1 /tmp/arm.sha)/" \
              packaging/noscat.rb > dist/noscat.rb
          # All placeholders must be gone; a missed sed means a broken formula.
          ! grep -E '__VERSION__|__SHA256' dist/noscat.rb
          cat dist/noscat.rb
      - uses: actions/upload-artifact@v4
        with:
          name: formula
          path: dist/noscat.rb
          retention-days: 1
      - name: Attach everything to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Push the filled formula to the public tap so brew install works the
  # moment a release is out. Needs a classic PAT with repo scope (the
  # built-in GITHUB_TOKEN cannot push cross-repo): create one at
  # github.com/settings/tokens and add it as the HOMEBREW_TAP_TOKEN secret.
  update-tap:
    name: update homebrew tap
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: formula
          path: dist
      - name: Push the formula to Letdown2491/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping the tap update."
            exit 0
          fi
          git clone "https://x-access-token:$GH_TOKEN@github.com/Letdown2491/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/noscat.rb tap/Formula/noscat.rb
          git -C tap config user.name "noscat-release-bot"
          git -C tap config user.email "noreply@github.com"
          git -C tap add Formula/noscat.rb
          if git -C tap diff --cached --quiet; then
            echo "formula unchanged; nothing to push"
          else
            git -C tap commit -m "noscat ${GITHUB_REF_NAME#v}"
            git -C tap push origin main
          fi
