# Release: tag v* builds every package and attaches it to the GitHub
# release. One leg per architecture, each on a native runner (no cross
# toolchains: musl.cc is unreachable from runners, and native musl-gcc
# comes from the distro's musl-tools package).
#
# - Linux (x86_64 + aarch64): static musl binaries -> deb/rpm/apk/archlinux
#   via nfpm (one config, packaging/nfpm.yaml), plus tarballs for the
#   curl|sh install script.
# - macOS (aarch64 + x86_64): unsigned tarballs; the publish job generates
#   the Homebrew formula (noscat.rb) with real sha256s for the tap.
# - Windows (x86_64): zip for Scoop and the winget manifests.
# - The publish job also fills the AUR and winget templates
#   (packaging/PKGBUILD, .SRCINFO, packaging/winget/) and attaches them.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: linux ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            nfpm_arch: amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            nfpm_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-gcc (native; bundled sqlite needs a C compiler)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build (static musl)
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage and smoke-check
        run: |
          mkdir -p staging/completions dist
          cp target/${{ matrix.target }}/release/noscat staging/noscat
          cp packaging/noscat.1 staging/
          ./staging/noscat --version
          ./staging/noscat completions bash  > staging/completions/noscat.bash
          ./staging/noscat completions zsh   > staging/completions/noscat.zsh
          ./staging/noscat completions fish  > staging/completions/noscat.fish
          tar -czf dist/noscat-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz \
              -C staging noscat noscat.1 completions

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Package (deb, rpm, apk, archlinux)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ARCH: ${{ matrix.nfpm_arch }}
        run: |
          for fmt in deb rpm apk archlinux; do
            nfpm package -f packaging/nfpm.yaml -p "$fmt" -t dist/
          done
          # Smoke: each package reads back and names the payload.
          ls -la dist/
          dpkg-deb --info dist/noscat_${VERSION}_${{ matrix.nfpm_arch }}.deb | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  macos:
    name: macos ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest # arm64 (macos-26)
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage and smoke-check
        run: |
          mkdir -p staging/completions dist
          cp target/${{ matrix.target }}/release/noscat staging/noscat
          cp packaging/noscat.1 staging/
          ./staging/noscat --version
          ./staging/noscat completions bash > staging/completions/noscat.bash
          ./staging/noscat completions zsh  > staging/completions/noscat.zsh
          ./staging/noscat completions fish > staging/completions/noscat.fish
          tar -czf dist/noscat-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz \
              -C staging noscat noscat.1 completions

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  windows:
    name: windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Zip and smoke-check
        shell: pwsh
        run: |
          mkdir dist
          & target/release/noscat.exe --version
          Compress-Archive -Path target/release/noscat.exe `
            -DestinationPath dist/noscat-$env:GITHUB_REF_NAME-windows-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          retention-days: 1

  api-compat:
    name: API compat (cargo semver-checks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install libdbus and libclang (the FIPS crates link them on glibc)
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libclang-dev
      - name: Flag breaking changes against the published crates
        # Mechanical backstop for API.md: a signature break must ride a
        # minor bump (0.x rules), never a patch. Checks every workspace
        # crate by default.
        uses: obi1kenobi/cargo-semver-checks-action@v2

  release:
    name: publish release
    needs: [linux, macos, windows, api-compat]
    # needs holds the publish for the whole build matrix: a failed arch
    # publishes nothing, which is the right shape for a release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate the Homebrew formula with real sha256s
        run: |
          SHA_ARM=$(sha256sum dist/noscat-$GITHUB_REF_NAME-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)
          SHA_X86=$(sha256sum dist/noscat-$GITHUB_REF_NAME-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)
          SHA_LIN_ARM=$(sha256sum dist/noscat-$GITHUB_REF_NAME-aarch64-unknown-linux-musl.tar.gz | cut -d' ' -f1)
          SHA_LIN_X86=$(sha256sum dist/noscat-$GITHUB_REF_NAME-x86_64-unknown-linux-musl.tar.gz | cut -d' ' -f1)
          # Craft Linux bottles from the musl tarballs (static binary, no paths
          # to relocate) so brew pour works without a C toolchain.
          chmod +x packaging/make-bottle.sh
          packaging/make-bottle.sh "${{ steps.ver.outputs.version }}" \
            packaging/noscat.rb dist/noscat-$GITHUB_REF_NAME-x86_64-unknown-linux-musl.tar.gz \
            x86_64_linux dist/ > /tmp/x86.sha
          packaging/make-bottle.sh "${{ steps.ver.outputs.version }}" \
            packaging/noscat.rb dist/noscat-$GITHUB_REF_NAME-aarch64-unknown-linux-musl.tar.gz \
            arm64_linux dist/ > /tmp/arm.sha
          sed -e "s/__VERSION__/${{ steps.ver.outputs.version }}/" \
              -e "s/__SHA256_AARCH64__/$SHA_ARM/" \
              -e "s/__SHA256_X86_64__/$SHA_X86/" \
              -e "s/__SHA256_LINUX_AARCH64__/$SHA_LIN_ARM/" \
              -e "s/__SHA256_LINUX_X86_64__/$SHA_LIN_X86/" \
              -e "s/__SHA256_BOTTLE_X86_64_LINUX__/$(cut -d' ' -f1 /tmp/x86.sha)/" \
              -e "s/__SHA256_BOTTLE_ARM64_LINUX__/$(cut -d' ' -f1 /tmp/arm.sha)/" \
              packaging/noscat.rb > dist/noscat.rb
          # All placeholders must be gone; a missed sed means a broken formula.
          ! grep -E '__VERSION__|__SHA256' dist/noscat.rb
          cat dist/noscat.rb
      - uses: actions/upload-artifact@v4
        with:
          name: formula
          path: dist/noscat.rb
          retention-days: 1

      - name: Fill the AUR and winget templates
        # Ready-to-submit files attached to the release: the AUR package
        # (PKGBUILD and .SRCINFO, with the b2sum of the tag's source
        # tarball) and the three winget manifests (sha256 of the Windows
        # zip). Submitting them stays a manual step.
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          B2=$(curl -fsSL "https://github.com/${{ github.repository }}/archive/refs/tags/$GITHUB_REF_NAME.tar.gz" | b2sum | cut -d' ' -f1)
          WIN_SHA=$(sha256sum dist/noscat-$GITHUB_REF_NAME-windows-amd64.zip | cut -d' ' -f1)
          DATE=$(date -u +%Y-%m-%d)
          fill() { sed -e "s/__VERSION__/$VERSION/g" -e "s/__B2SUM__/$B2/g" -e "s/__SHA256__/$WIN_SHA/g" -e "s/__DATE__/$DATE/g" "$1" > "$2"; }
          mkdir -p aur winget
          fill packaging/PKGBUILD aur/PKGBUILD
          fill packaging/.SRCINFO aur/.SRCINFO
          for f in packaging/winget/*.yaml; do fill "$f" "winget/$(basename "$f")"; done
          ! grep -rE '__(VERSION|B2SUM|SHA256|DATE)__' aur winget
          tar -czf dist/noscat-aur-$GITHUB_REF_NAME.tar.gz aur
          tar -czf dist/noscat-winget-$GITHUB_REF_NAME.tar.gz winget
          cat aur/PKGBUILD winget/*.yaml

      - name: Install libdbus and libclang (cargo publish builds each crate on glibc)
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libclang-dev
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; skipping crates.io."
            exit 0
          fi
          VERSION="${{ steps.ver.outputs.version }}"
          # The workspace version must equal the tag version: crates.io is
          # immutable, a mismatched publish would be a lie forever. Bump
          # Cargo.toml as part of tagging.
          if ! grep -q "^version = \"$VERSION\"" Cargo.toml; then
            echo "Cargo.toml version != tag version ($VERSION); bump it before tagging."
            exit 1
          fi
          # Idempotent: a rerun of a half-finished publish must skip crates
          # whose version is already on the index instead of failing there.
          # (A curl pre-check against the index does not work here: crates.io
          # rate-limits GitHub Actions runner IPs, so the probe itself
          # errors.) Publish and read the outcome instead.
          publish_if_missing() {
            local out
            if out=$(cargo publish --locked -p "$1" 2>&1); then
              echo "published $1 $VERSION"
            elif echo "$out" | grep -q "already exists"; then
              echo "$1 $VERSION is already published; skipping"
            else
              echo "$out" >&2
              exit 1
            fi
          }
          publish_if_missing noscat-core
          sleep 15 # let crates.io index noscat-core before dependents land
          publish_if_missing noscat-client
          sleep 15 # let crates.io index noscat-client before dependents land
          publish_if_missing noscat
          sleep 15 # let crates.io index noscat before the ffi bridge lands
          publish_if_missing noscat-ffi

      - name: Attach everything to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Update the Scoop bucket (Windows users): push the manifest with the
  # release's real zip sha256. Uses the same fine-grained PAT as the tap -
  # the token's repository access must include scoop-bucket too.
  update-scoop:
    name: update scoop bucket
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Push the manifest to Letdown2491/scoop-bucket
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping the bucket update."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/Letdown2491/noscat/releases/download/$GITHUB_REF_NAME/noscat-$GITHUB_REF_NAME-windows-amd64.zip"
          SHA=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
          git clone "https://x-access-token:$GH_TOKEN@github.com/Letdown2491/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cat > bucket/bucket/noscat.json <<EOF
          {
              "version": "$VERSION",
              "description": "Like netcat, but over your own device mesh: npub-addressed, end-to-end encrypted, no root, no accounts. Membership is a Marmot (MLS) group on Nostr relays; data goes device to device over FIPS.",
              "homepage": "https://github.com/Letdown2491/noscat",
              "license": "MIT",
              "architecture": {
                  "64bit": {
                      "url": "$URL",
                      "hash": "$SHA"
                  }
              },
              "bin": "noscat.exe",
              "checkver": {
                  "github": "https://github.com/Letdown2491/noscat"
              }
          }
          EOF
          git -C bucket config user.name "noscat-release-bot"
          git -C bucket config user.email "noreply@github.com"
          git -C bucket add bucket/noscat.json
          if git -C bucket diff --cached --quiet; then
            echo "manifest unchanged; nothing to push"
          else
            git -C bucket commit -m "noscat $VERSION"
            git -C bucket push origin main
          fi

  # Rebuild the pacman repository on the gh-pages branch with the release's
  # prebuilt arch packages: users add one Server line to pacman.conf and get
  # pacman -S noscat + normal -Syu upgrades (unsigned repo; SigLevel = Never).
  # The AUR package is separate: packaging/PKGBUILD builds from source when
  # AUR registration reopens.
  pacman-repo:
    name: pacman repo (github pages)
    needs: release
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - name: Install git (repo-add ships with pacman)
        run: pacman -Sy --noconfirm git
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Rebuild the repo database with the release packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pages/x86_64 pages/aarch64
          # keep only the current release's packages
          rm -f pages/x86_64/noscat-*.pkg.tar.zst pages/aarch64/noscat-*.pkg.tar.zst
          cp dist/*x86_64.pkg.tar.zst pages/x86_64/
          cp dist/*aarch64.pkg.tar.zst pages/aarch64/
          (cd pages/x86_64 && repo-add -n -R noscat.db.tar.zst noscat-*.pkg.tar.zst)
          (cd pages/aarch64 && repo-add -n -R noscat.db.tar.zst noscat-*.pkg.tar.zst)
      - name: Commit and push
        run: |
          git -C pages config user.name "noscat-release-bot"
          git -C pages config user.email "noreply@github.com"
          git -C pages add -A
          if git -C pages diff --cached --quiet; then
            echo "repo unchanged; nothing to push"
          else
            git -C pages commit -m "pacman repo: ${GITHUB_REF_NAME#v}"
            git -C pages push origin gh-pages
          fi

  # Push the filled formula to the public tap so brew install works the
  # moment a release is out. Needs a classic PAT with repo scope (the
  # built-in GITHUB_TOKEN cannot push cross-repo): create one at
  # github.com/settings/tokens and add it as the HOMEBREW_TAP_TOKEN secret.
  update-tap:
    name: update homebrew tap
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: formula
          path: dist
      - name: Push the formula to Letdown2491/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping the tap update."
            exit 0
          fi
          git clone "https://x-access-token:$GH_TOKEN@github.com/Letdown2491/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/noscat.rb tap/Formula/noscat.rb
          git -C tap config user.name "noscat-release-bot"
          git -C tap config user.email "noreply@github.com"
          git -C tap add Formula/noscat.rb
          if git -C tap diff --cached --quiet; then
            echo "formula unchanged; nothing to push"
          else
            git -C tap commit -m "noscat ${GITHUB_REF_NAME#v}"
            git -C tap push origin main
          fi
