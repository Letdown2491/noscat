# Winget manifest for noscat. For local testing:
#   winget install --manifest packaging/winget/
# For the community repo, submit the multi-file form to microsoft/winget-pkgs
# (manifests/l/Letdown2491/noscat/<version>/) - the fields below carry over
# verbatim; only the InstallerUrl changes per release.
YamlMime:SingleFileManifest
PackageIdentifier: Letdown2491.noscat
PackageVersion: 0.1.0
PackageLocale: en-US
Publisher: Letdown2491
PublisherUrl: https://github.com/Letdown2491
PackageName: noscat
PackageUrl: https://github.com/Letdown2491/noscat
License: MIT
LicenseUrl: https://github.com/Letdown2491/noscat/blob/main/LICENSE
ShortDescription: Like netcat, but over a Nostr-native mesh - npub-addressed tunnels, no root, no accounts
Description: |-
  noscat gives every machine a self-generated Nostr identity (a keypair) and
  tunnels encrypted traffic between machines by that identity. Direct
  end-to-end encryption over UDP with NAT hole punching; Nostr relays are
  only the discovery channel. Includes tailnet (MLS group) scoping, file
  transfer with resume, and TCP port forwarding.
Moniker: noscat
ManifestType: SingleFileManifest
ManifestVersion: 1.6.0
Installers:
  - Architecture: x64
    InstallerType: zip
    InstallerUrl: https://github.com/Letdown2491/noscat/releases/download/v0.1.0/noscat-v0.1.0-windows-amd64.zip
    InstallerSha256: __SHA256_ZIP__
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: noscat.exe
        PortableCommandAlias: noscat
