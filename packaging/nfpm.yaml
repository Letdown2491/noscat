# One config, four package formats: `nfpm package -p deb|rpm|apk|archlinux`.
# The release workflow stages the static musl binary, man page, and shell
# completions into ./staging first; VERSION and ARCH come from the workflow
# (nfpm maps them per format: deb amd64, rpm x86_64, apk x86_64, arch x86_64).
name: noscat
arch: ${ARCH}
version: ${VERSION}
maintainer: Letdown2491 <https://github.com/Letdown2491>
description: |-
  like netcat, but over your own device mesh: npub-addressed, end-to-end
  encrypted, no root, no accounts. Membership is a Marmot (MLS) group on
  Nostr relays; data goes device to device over FIPS with QUIC streams.
license: MIT
homepage: https://github.com/Letdown2491/noscat

contents:
  - src: ./staging/noscat
    dst: /usr/bin/noscat
  - src: ./staging/noscat.1
    dst: /usr/share/man/man1/noscat.1
    file_info:
      mode: 0644
  - src: ./staging/completions/noscat.bash
    dst: /usr/share/bash-completion/completions/noscat
    file_info:
      mode: 0644
  - src: ./staging/completions/noscat.zsh
    dst: /usr/share/zsh/site-functions/_noscat
    file_info:
      mode: 0644
  - src: ./staging/completions/noscat.fish
    dst: /usr/share/fish/vendor_completions.d/noscat.fish
    file_info:
      mode: 0644
