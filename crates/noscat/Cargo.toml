[package]
name = "noscat"
description = "like netcat, but over your own device mesh: npub-addressed, end-to-end encrypted, no root, no accounts"
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "noscat"
path = "src/main.rs"

[dependencies]
noscat-core = { workspace = true }
noscat-client = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nostr = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
qrcode = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { workspace = true }
# "windows": the console backend; it adds nothing elsewhere.
crossterm = { version = "0.29", default-features = false, features = ["windows"] }

[target.'cfg(windows)'.dependencies]
# `noscat shell`: VT input and output and UTF-8 on the console.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
nostr-relay-builder = "0.44"

[lints]
workspace = true
