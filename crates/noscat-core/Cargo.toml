[package]
name = "noscat-core"
description = "Core library for noscat: a private device mesh on Marmot (MLS over Nostr) and FIPS, with QUIC streams"
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
nostr = { workspace = true }
nostr-sdk = { workspace = true }
secp256k1 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
openmls = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_traits = { workspace = true }
openmls_memory_storage = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
tls_codec = { workspace = true }
ed25519-dalek = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
nvpn-fips-core = { workspace = true }
fips-nostr = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
[dev-dependencies]
# An in-process relay for the device tests.
nostr-relay-builder = "0.44"

# gethostname(3) is unix-only; other platforms have no caller yet (the
# default device name falls back to "noscat").
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
