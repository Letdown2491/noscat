[package]
name = "noscat-client"
description = "Client layer for noscat: one device with mesh operations, app streams and an event stream, for UIs and the CLI"
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
noscat-core = { path = "../noscat-core", version = "0.7.1" }
tokio = { workspace = true }
thiserror = { workspace = true }
nostr = { workspace = true }
quinn = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }

# Hosting a terminal (0.6): computers only; phones are viewers.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
portable-pty = "0.9"

[dev-dependencies]
nostr-relay-builder = "0.44"
rand = { workspace = true }

[lints]
workspace = true
