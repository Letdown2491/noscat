[package]
name = "noscat-ffi"
description = "UniFFI bindings over the noscat client stack for mobile apps (Kotlin, Swift)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# cdylib: the .so mobile apps load; lib: uniffi-bindgen reads it.
crate-type = ["lib", "cdylib"]

[dependencies]
noscat-core = { workspace = true }
noscat-client = { workspace = true }
uniffi = { version = "0.29", features = ["cli"] }
thiserror = { workspace = true }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[lints]
workspace = true
