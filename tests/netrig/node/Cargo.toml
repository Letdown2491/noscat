[package]
name = "netrig-node"
version = "0.0.0"
edition = "2024"
publish = false
description = "netrig device: noscat-core's Dataplane and Streams in one process per namespace"

# Standalone: never part of the published noscat workspace.
[workspace]

[dependencies]
noscat-core = { path = "../../../crates/noscat-core" }
nostr = "0.45"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
sha2 = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
